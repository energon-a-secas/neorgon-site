<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Avenir Next','Segoe UI',Roboto,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#0a0a24" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#040714"/>
  <rect width="1200" height="620" fill="url(#glow)"/>
  
  
  <text x="80" y="84" fill="#B015B0" font-size="20" font-weight="700" letter-spacing="3.4">THE LEAK</text>
  <text x="80" y="132" fill="#f9f9f9" font-size="42" font-weight="700" letter-spacing="-.4">A style that travelled</text>
  <text x="80" y="168" fill="rgba(255,255,255,.46)" font-size="21">cloneNode copies inline styles. That is the whole bug.</text>

  <rect x="80" y="210" width="320" height="150" rx="14" fill="#f9f9f9" fill-opacity=".04" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
  <text x="104" y="248" fill="rgba(255,255,255,.46)" font-size="17" font-weight="700" letter-spacing="1.6">CATALOG CARD</text>
  <text x="104" y="286" fill="#f9f9f9" font-size="21">entrance.js writes</text>
  <text x="104" y="320" fill="#B015B0" font-size="23" font-weight="700" font-family="monospace">animation-delay: 5060ms</text>
  <text x="104" y="346" fill="rgba(255,255,255,.46)" font-size="17">inline, on the element</text>

  <line x1="410" y1="285" x2="490" y2="285" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
  <path d="M490 285 l-12 -6 v12 z" fill="rgba(255,255,255,.16)"/>
  <text x="450" y="268" text-anchor="middle" fill="rgba(255,255,255,.46)" font-size="17" font-family="monospace">clone</text>

  <rect x="500" y="210" width="620" height="150" rx="14" fill="#f9f9f9" fill-opacity=".06" stroke="#B015B0" stroke-width="1.5"/>
  <text x="524" y="248" fill="rgba(255,255,255,.46)" font-size="17" font-weight="700" letter-spacing="1.6">THE SAME CARD, ON THE NEW SHELF</text>
  <text x="524" y="288" fill="rgba(255,255,255,.46)" font-size="20" font-family="monospace" text-decoration="line-through">animation-delay: var(--echo-delay)</text>
  <text x="524" y="322" fill="#B015B0" font-size="23" font-weight="700" font-family="monospace">animation-delay: 5060ms</text>
  <text x="524" y="348" fill="rgba(255,255,255,.46)" font-size="17">inline beats the stylesheet, every time</text>

  <text x="80" y="440" fill="#f9f9f9" font-size="24" font-weight="600">The shelf declared its timing in CSS. The clone arrived carrying someone else's.</text>
  <text x="80" y="482" fill="rgba(255,255,255,.62)" font-size="21">The stylesheet was never wrong. It just never got a turn.</text>

  <rect x="80" y="512" width="1040" height="62" rx="14" fill="#f9f9f9" fill-opacity=".04" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
  <text x="104" y="551" fill="rgba(255,255,255,.62)" font-size="21" font-family="monospace">echo.style.animationDelay = '';   // drop what came with the clone</text>
  
</svg>