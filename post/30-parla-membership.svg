  <text x="700" y="476" fill="rgba(255,255,255,.46)" font-size="19">1 result. The blob only opens a group when</text>
  <text x="700" y="502" fill="rgba(255,255,255,.46)" font-size="19">nothing matched directly.</text>

  <text x="70" y="600" fill="rgba(255,255,255,.34)" font-size="17">Membership read from the CATEGORIES array in js/search.js at build time.</text>
</svg>