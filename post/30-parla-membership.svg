<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Avenir Next','Segoe UI',Roboto,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#0a0a24" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#040714"/>
  <rect width="1200" height="640" fill="url(#glow)"/>
  
  
  <text x="70" y="84" fill="#B015B0" font-size="20" font-weight="700" letter-spacing="3.4">ONE QUERY</text>
  <text x="70" y="132" fill="#f9f9f9" font-size="42" font-weight="700" letter-spacing="-.4">Searching “parla”</text>
  <text x="70" y="168" fill="rgba(255,255,255,.46)" font-size="21">Social owns 6 tools. One of them is called Parla.</text>

  <text x="70" y="252" fill="rgba(255,255,255,.62)" font-size="23" font-weight="600">BEFORE · the keyword blob promoted the group</text>
  
    <rect x="70" y="282" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="320" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">vibecheck</text>
    <rect x="238" y="282" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="313" y="320" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">hiringpack</text>
    <rect x="406" y="282" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="481" y="320" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">charactersheet</text>
    <rect x="70" y="362" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="400" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">parla</text>
    <rect x="238" y="362" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="313" y="400" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">playbook</text>
    <rect x="406" y="362" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="481" y="400" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">tubestack</text>
  <text x="70" y="476" fill="rgba(255,255,255,.46)" font-size="19">6 results. Parla ranked fourth, because Social</text>
  <text x="70" y="502" fill="rgba(255,255,255,.46)" font-size="19">sits fourth in the DOM.</text>

  <line x1="640" y1="240" x2="640" y2="520" stroke="rgba(255,255,255,.16)" stroke-width="1"/>

  <text x="700" y="252" fill="rgba(255,255,255,.62)" font-size="23" font-weight="600">AFTER · the query named a card</text>
  
    <rect x="700" y="282" width="150" height="62" rx="10"
          fill="rgba(255,255,255,.045)" fill-opacity="1"
          stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    <text x="775" y="320" text-anchor="middle"
          fill="rgba(255,255,255,.46)" font-size="19" font-weight="500">vibecheck</text>
    <rect x="868" y="282" width="150" height="62" rx="10"
          fill="rgba(255,255,255,.045)" fill-opacity="1"
