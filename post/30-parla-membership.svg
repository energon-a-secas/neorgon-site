    <text x="943" y="320" text-anchor="middle"
          fill="rgba(255,255,255,.46)" font-size="19" font-weight="500">hiringpack</text>
    <rect x="1036" y="282" width="150" height="62" rx="10"
          fill="rgba(255,255,255,.045)" fill-opacity="1"
          stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    <text x="1111" y="320" text-anchor="middle"
          fill="rgba(255,255,255,.46)" font-size="19" font-weight="500">charactersheet</text>
    <rect x="700" y="362" width="150" height="62" rx="10"
          fill="#38bdf8" fill-opacity="0.9"
          stroke="#38bdf8" stroke-width="2"/>
    <text x="775" y="400" text-anchor="middle"
          fill="#040714" font-size="19" font-weight="700">parla</text>
    <rect x="868" y="362" width="150" height="62" rx="10"
          fill="rgba(255,255,255,.045)" fill-opacity="1"
          stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    <text x="943" y="400" text-anchor="middle"
          fill="rgba(255,255,255,.46)" font-size="19" font-weight="500">playbook</text>
    <rect x="1036" y="362" width="150" height="62" rx="10"
          fill="rgba(255,255,255,.045)" fill-opacity="1"
          stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    <text x="1111" y="400" text-anchor="middle"
