<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" font-family="'Avenir Next','Segoe UI',Roboto,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1a1040" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#0a0a24" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="810" fill="#040714"/>
  <rect width="1200" height="810" fill="url(#glow)"/>
  
  
  <text x="64" y="88" fill="#B015B0" font-size="20" font-weight="700" letter-spacing="3.4">ONE OWNER</text>
  <text x="64" y="136" fill="#f9f9f9" font-size="42" font-weight="700" letter-spacing="-.4">Three things need the same number</text>
  <text x="64" y="172" fill="rgba(255,255,255,.46)" font-size="21">Each computed it separately. All three were wrong in a different way.</text>
  <rect x="74" y="377" width="330" height="132" rx="14" fill="rgba(176,21,176,.14)" stroke="#B015B0" stroke-opacity=".55" stroke-width="2"/>
  <text x="100" y="423" fill="#f9f9f9" font-size="25" font-weight="700" font-family="ui-monospace,Menlo,monospace">anchorOffset()</text>
  <text x="100" y="457" fill="rgba(255,255,255,.62)" font-size="19">rail 62 + header 68 + 16</text>
  <text x="100" y="489" fill="#B015B0" font-size="28" font-weight="700">= 146px</text>
  <text x="100" y="351" fill="rgba(255,255,255,.46)" font-size="18" letter-spacing="2">MEASURED ONCE, LIVE</text>
  
    <path d="M 404 443 C 514 443, 490 275, 586 275" fill="none" stroke="#B015B0" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="586" cy="275" r="4" fill="#B015B0"/>
    <rect x="600" y="208" width="536" height="134" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
    <text x="626" y="248" fill="#f9f9f9" font-size="23" font-weight="700" font-family="ui-monospace,Menlo,monospace">scroll-margin-top</text>
    <text x="626" y="276" fill="rgba(255,255,255,.62)" font-size="19">on every .card-group</text>
    <text x="626" y="300" fill="rgba(255,255,255,.46)" font-size="17">was a JS scroll fix, overwritten by Chrome's own re-jump — the</text><text x="626" y="326" fill="rgba(255,255,255,.46)" font-size="17">heading sat at top: 0</text>
    <path d="M 404 443 C 514 443, 490 443, 586 443" fill="none" stroke="#B015B0" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="586" cy="443" r="4" fill="#B015B0"/>
    <rect x="600" y="376" width="536" height="134" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
    <text x="626" y="416" fill="#f9f9f9" font-size="23" font-weight="700" font-family="ui-monospace,Menlo,monospace">--cat-rail-top</text>
    <text x="626" y="444" fill="rgba(255,255,255,.62)" font-size="19">the rail's own sticky top</text>
    <text x="626" y="468" fill="rgba(255,255,255,.46)" font-size="17">was hardcoded 62px under a 68px header, hiding 12px of the</text><text x="626" y="494" fill="rgba(255,255,255,.46)" font-size="17">rail</text>
    <path d="M 404 443 C 514 443, 490 611, 586 611" fill="none" stroke="#B015B0" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="586" cy="611" r="4" fill="#B015B0"/>
    <rect x="600" y="544" width="536" height="134" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
    <text x="626" y="584" fill="#f9f9f9" font-size="23" font-weight="700" font-family="ui-monospace,Menlo,monospace">readingLine()  (+8)</text>
    <text x="626" y="612" fill="rgba(255,255,255,.62)" font-size="19">which chip lights up</text>
    <text x="626" y="636" fill="rgba(255,255,255,.46)" font-size="17">was computed apart and 8px adrift — lit the section above the</text><text x="626" y="662" fill="rgba(255,255,255,.46)" font-size="17">one you jumped to</text>
  <text x="64" y="748" fill="rgba(255,255,255,.34)" font-size="17">Grey text is what each consumer did before it derived from the same function.</text>
  <text x="64" y="776" fill="rgba(255,255,255,.34)" font-size="17">Verified by navigating to #group-health: the heading now lands at 146px with the right chip lit.</text>
</svg>