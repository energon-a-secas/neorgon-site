  <text x="80" y="960.8" fill="rgba(255,255,255,.34)" font-size="17">Same viewport, same query, drawn to scale. The four blocks are browse surfaces:</text>
  <text x="80" y="990.8" fill="rgba(255,255,255,.34)" font-size="17">none of them can hold a match that the merged results grid does not already show.</text>
