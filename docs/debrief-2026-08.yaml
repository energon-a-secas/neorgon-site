presentation:
  title: "The hub that couldn't count"
  subtitle: "Recency, navigation, and six defects nobody had measured"
  author: "Luciano Adonis"
  date: "2026-08"

  slides:
    - type: title
      heading: "The hub that couldn't count"
      subtitle: "neorgon.com — 50 tools, 11 categories, no way to find any of them"

    - type: bullets
      heading: "Ship a new tool and nothing on the page says so"
      bullets:
        - "New tool drops into its category, in no particular order"
        - "Looks identical to one from February"
        - "Returning visitor scrolls 11 sections hunting a new name"
        - "The page had no concept of time at all"
      note: >
        This was the original ask, and the only one on the list. The rest of
        the deck is what turned up while fixing it.

    - type: stats
      background: ocean
      heading: "What was actually there when we looked"
      stats:
        - value: "13"
          label: "Tools shipped in 30 days, none marked"
        - value: "0"
          label: "Navigation for 11 sections"
        - value: "4"
          label: "Cards no category pill could reach"
        - value: "8"
          label: "Console errors on load"

    - type: divider
      heading: "What we found"
      subtitle: "Every defect had a number attached"

    - type: bullets
      heading: "The page contradicted itself about its own size"
      bullets:
        - "Hero HTML said 40 tools; script computed 43"
        - "The number visibly flipped on load"
        - "Title, meta, OG and JSON-LD all said 40"
        - "19 New badges rendered for 13 new tools"
      note: >
        The badge count was a cloning bug — the recency shelf clones cards,
        and badges were stamped before the clone, so 6 echoes inherited one.

    - type: bullets
      heading: "Category pills pointed at sections that did not exist"
      bullets:
        - "'Learning' matched no DOM group at all"
        - "'Game' filtered the catalog to zero results"
        - "teamplay, stash, safeguard, pieza in no pill list"
        - "Worse than a label mismatch — a dead-end click"

    - type: bullets
      heading: "One number, computed three times, wrong three ways"
      bullets:
        - "Rail sticky top hardcoded 62px under a 68px header"
        - "12px of the rail lived under the header"
        - "Scroll-spy reading line drifted 8px from the jump target"
        - "Jumping to Health highlighted Lifehacks"
      note: >
        The 8px is the one worth dwelling on: the section you just landed on
        counted as not-yet-reached, so the highlight went to the one above it.

    - type: bullets
      heading: "Chrome overwrote every JS scroll correction"
      bullets:
        - "#group-health landed at top: 0, under 130px of chrome"
        - "Corrections at 120ms, 400ms, 900ms and on load all lost"
        - "16 samples over 1.5s: pinned at 0, not drifting"
        - "Chrome re-jumps on every layout shift during load"

    - type: code
      heading: "The fix was to delete the arithmetic"
      language: js
      code: |
        // scroll-margin-top is the only offset the *browser's*
        // fragment jump honours. Declared once, every
        // re-application already lands correctly.
        function anchorOffset() {
          var header = document.querySelector('.header-bar');
          return rail.offsetHeight
               + (header ? header.offsetHeight : 0) + 16;
        }
      note: >
        One owner for the offset. It feeds scroll-margin-top, --cat-rail-top
        and readingLine(), and terminal.js `open <cat>` reads it too instead
        of keeping a second copy.

    - type: divider
      heading: "What changed"
      subtitle: "Five themes, one afternoon"

    - type: split
      heading: "Recency: the data model came first"
      left:
        heading: "The attribute"
        bullets:
          - "data-added=\"YYYY-MM-DD\" on all 50 cards"
          - "Date sits next to what it describes"
          - "No list to keep in sync"
      right:
        heading: "What reads it"
        bullets:
          - "Shelf of the newest 6, above the categories"
          - "New badge, self-expiring at 30 days"
          - "Terminal's `new` command"

    - type: columns
      heading: "Two simpler options, and why they lost"
      left:
        heading: "Read dates from the site registry"
        text: >
          It is the monorepo's source of truth and already lists every site.
          But it has no launch-date field to read, the hub would gain a runtime
          fetch plus a CSP entry for static data, and the shelf would silently
          empty out whenever that fetch failed.
      right:
        heading: "A hand-curated array of recent IDs"
        text: >
          The simplest thing that works, and rejected because nothing expires.
          The New badge would sit on a four-month-old tool until someone
          remembered to rotate the list. Dates expire on their own.

    - type: bullets
      heading: "Navigation: three surfaces, all reading the DOM"
      bullets:
        - "Sticky category rail, live counts, scroll-spy"
        - "Cmd+K palette over every tool, recency tie-break"
        - "Enter-to-open and arrow walking in hero search"
        - "All 11 pills realigned 1:1 with real sections"

    - type: bullets
      heading: "Mobile: the shelf buried what it introduces"
      bullets:
        - "6 cards in one column was 1670px — two screens"
        - "Catalog started at y=2228 on a 390px phone"
        - "Now a snap-scrolling row: 406px, catalog at y=964"
        - "Snap aligns to scroll-padding-inline, not padding-inline"

    - type: bullets
      heading: "Terminal: DOM-driven, 12 new commands"
      bullets:
        - "Hardcoded tool list replaced by a DOM read"
        - "New card is reachable with no terminal edit"
        - "tools, goto, open, search, new, whois, stats, theme"
        - "Tab completion, longest-common-prefix"
      note: >
        `theme` sets the visitor's own neo_theme cookie only. Fleet-wide CDN
        header control was deliberately left out — see the open items slide.

    - type: qa
      heading: "Questions so far?"
      subtext: "Next: the measurements, then what is still broken"

    - type: divider
      heading: "Proof"
      subtitle: "Read out of a live browser, not estimated"

    - type: stats
      background: ocean
      heading: "Before and after, counted"
      stats:
        - value: "2 → 1"
          label: "Footers rendered"
        - value: "19 → 13"
          label: "New badges vs 13 new tools"
        - value: "4 → 0"
          label: "Cards unreachable by pill"
        - value: "8 → 3"
          label: "Console errors on load"

    - type: stats
      background: ocean
      heading: "Navigation, measured on a live page"
      stats:
        - value: "0 → 146px"
          label: "Deep-link heading position"
        - value: "22/22"
          label: "Chips landing correctly at 1440 and 390px"
        - value: "6/6"
          label: "Scroll-spy sample positions correct"
        - value: "12 → 0px"
          label: "Rail hidden under the header"

    - type: bullets
      heading: "How each figure was taken"
      bullets:
        - "browser_evaluate against a live local server"
        - "Chips: click each, assert rect top and .active"
        - "Spy: scrollY 1200 to 99999, incl. page bottom"
        - "Counts: DOM queries, not reading the source"
      note: >
        The last-group chip could never light until tested at scrollY 99999 —
        Platforms is one row above the footer, so the page bottoms out before
        its heading reaches the reading line. Found by asserting, not reading.

    - type: bullets
      heading: "One fix nobody would have reported"
      bullets:
        - "script-src and connect-src missing the terminal's hosts"
        - "Admin login path was dead in production"
        - "img-src missing googletagmanager — GA pixel blocked"
        - "Found while testing something adjacent"

    - type: divider
      heading: "What it cost"
      subtitle: "And where the time actually went"

    - type: stats
      background: ocean
      heading: "The diff"
      stats:
        - value: "1076"
          label: "Lines added"
        - value: "144"
          label: "Lines removed"
        - value: "3"
          label: "New JS modules"
        - value: "6"
          label: "Files touched"

    - type: bullets
      heading: "Where the time went that was not the feature"
      bullets:
        - "~8 turns lost to Chrome replaying cached JS"
        - "transferSize: 0 diagnosed it, matching the committed file"
        - "F5, cachebust, hash, touch, restart — none worked"
        - "Fresh port is the reliable workaround"
      note: >
        No service worker registered. Diagnosed with
        performance.getEntriesByType('resource'). Also lost time to a
        Playwright profile corrupted by repeated SIGKILL — deleting the whole
        profile directory is the fix, killing processes is not.

    - type: divider
      heading: "What is still open"
      subtitle: "Nothing here was silently dropped"

    - type: bullets
      heading: "Two hub cards are dead links right now"
      bullets:
        - "pieza.neorgon.com has no DNS record at all"
        - "cardforge: 200 over HTTP, 000 over HTTPS, no cert"
        - "Pages API returns 422 or 404; must wait"
        - "pieza-site's git remote points at the wrong repo"
      note: >
        Both are infra, outside this repo. The pieza card shipped before its
        subdomain existed, which is the same class of problem this whole
        project was about.

    - type: bullets
      heading: "Known gaps we chose not to close"
      bullets:
        - "Registry disagrees with reality on 5 sites"
        - "2 of 50 ship dates are proxies, marked inline"
        - "Footer Kit migration deferred — fleet-wide runbook"
        - "CDN header control deferred to an ops console"
      note: >
        Registry: 2 live with no card, 3 marked as carded but returning 000.
        Reconciling means deciding per site which side is wrong, and guessing
        would be worse than leaving the disagreement visible.

    - type: quote
      text: >
        Every real defect on that page was countable. Not "the navigation
        feels bad" — 4 cards unreachable, 2 footers, 19 badges for 13 tools,
        12px of overlap, 8px of drift.
      source: "Reading a page is not the same as measuring it"

    - type: cta
      heading: "Two things to carry forward"
      action: "Give one number one owner, and assert with a number rather than reading the code"
      subtext: "The 12px, the 8px and the deep link were one bug in three costumes"
