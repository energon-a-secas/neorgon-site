presentation:
  title: "A card that cannot lie"
  author: "LucianoAdonis"
  date: "2026-08-11"

  slides:
    - type: title
      heading: "A card that cannot lie"
      subtitle: "Three things neorgon.com was wrong about, and why styling the fix was not enough"
      note: >
        Audience: eng. Scope is one session on projects/neorgon-site.
        The working tree also holds unrelated pre-existing edits (blog/*.html,
        about.html, the vendored footer kit) that are not part of this change set.

    - type: bullets
      heading: "Three complaints, filed separately"
      bullets:
        - "A section of the hub listed other people's sites"
        - "A card pointed at a domain that serves nothing"
        - "The Recently shipped shelf appeared last"
      note: >
        These arrived as three unrelated annoyances. The interesting part is that
        they turned out to be the same defect wearing three costumes. Do not give
        away the punchline here; the cause slide does it.

    - type: quote
      text: "Every one of those claims was maintained somewhere other than the thing making the claim."
      source: "The cause, in one sentence"
      note: >
        'These are ours' was maintained by me remembering not to add external cards.
        'This card goes somewhere' was maintained by me remembering to publish first.
        'Look at this shelf first' was maintained by a CSS rule with no authority.

    - type: divider
      heading: "The cause"
      subtitle: "The prettiest failure first"

    - type: image
      heading: "Every card, and the moment it appeared"
      src: "../post/png/10-entrance-timeline.png"
      alt: "Timeline of 50 card entrance delays, before and after, with the six-card shelf highlighted"
      caption: "50 cards, one tick each. The shelf is the pink row."
      note: >
        Before, the last shelf card landed at 5.06s. The shelf sits above the catalog,
        so anyone who scrolled in the first two seconds saw a heading with nothing under it.
        Delays are computed from entrance.js and recent.js by the diagram generator, and
        were separately confirmed in the browser.

    - type: code
      heading: "cloneNode copies inline styles"
      language: js
      code: |
        // entrance.js — writes an INLINE delay on every catalog card
        card.style.animationDelay = (i * 110) + 'ms';   // 47th card => 5060ms

        // recent.js — builds the shelf by cloning those cards
        var echo = c.el.cloneNode(true);                // …delay comes along

        // style.css — the shelf's own timing, which never got a turn
        .site-card--echo { animation-delay: var(--echo-delay); }
      note: >
        Proctor was the newest tool on the site and the 47th card down the catalog.
        It carried animation-delay 5060ms into the top slot of the shelf. Inline beats
        the stylesheet, so the newest tool was the last pixel on the page.
        Neither half was wrong on its own. The bug lives in the word "clone".

    - type: divider
      heading: "What changed"

    - type: split
      heading: "Every card points at something we own"
      left:
        heading: "Before"
        bullets:
          - "A group fed by an external API"
          - "Curated links to other people's sites"
          - "A CSP grant to fetch them"
      right:
        heading: "After"
        bullets:
          - "Group, script and CSP grant removed"
          - "GitHub and YouTube cards stay"
          - "Those are our accounts"
      note: >
        The rule is now written into PROJECTS.md. An external card is fine when the
        destination is ours. The Awesome Sites card survives because that site is ours;
        its feed does not, because its contents are not.

    - type: code
      heading: "A Soon card is not a link styled to look inert"
      language: html
      code: |
        <div class="site-card soon-card"
             data-card-id="pieza" data-status="soon">
          ...
          <span class="soon-badge">Soon</span>
        </div>
      note: >
        Rejected: pointer-events none (stops the mouse, not the keyboard), aria-disabled
        (a label, not a behaviour), and a greyed anchor (still a real URL for middle-click,
        copy-link and crawlers). A div has no href to leak. The badge tells a person;
        the element type makes it true whether or not they read the badge.

    - type: bullets
      heading: "One attribute, six readers"
      bullets:
        - "Hero count and search denominator skip it"
        - "Shelf and New badge skip it"
        - "Palette shows a chip, scrolls instead of opening"
        - "Terminal keeps it out of liveTools()"
        - "Search still finds it"
      note: >
        data-status="soon" is the single switch. Search reports
        "5 of 43 tools · 1 coming soon" rather than reporting zero for a card
        that is visibly on screen. Applied to the three sites the registry
        marks 'ready': pieza, rigcheck, tickbox.

    - type: stats
      background: ocean
      heading: "Measured"
      stats:
        - value: "5.39s → 0.44s"
          label: "Worst card entrance delay"
        - value: "5.06s → 0.30s"
          label: "When the new shelf finishes"
        - value: "46 → 43"
          label: "Tools the page claims"
        - value: "3"
          label: "Dead destinations removed"
      note: >
        Entrance figures computed from the constants and confirmed in the browser.
        The count moved because three unshipped tools stopped being counted.
        make smoke passed 18/18.

    - type: bullets
      heading: "What it cost"
      bullets:
        - "Cards below the fold no longer animate on scroll"
        - "Soon cards need a second edit to go live"
        - "Two accent colours had to be re-picked"
      note: >
        The scroll reveal was a real loss. An IntersectionObserver would restore it,
        but the CSS default (opacity 0 plus a forwards animation) is what keeps the
        catalog visible when JS fails, and driving reveal from an observer means a
        blank slot if it never fires. Capping fixes the reported symptom with no new
        failure mode. The colour collisions were mine: PROJECTS.md already reserved
        #22c55e for TickBox and #7c3aed for CardForge.

    - type: qa
      heading: "Questions on the change?"
      note: >
        Natural checkpoint: everything after this is what I found and did not fix.
        Likely question: why not restore the scroll reveal with an observer.
        Answer is on the cost slide.

    - type: divider
      heading: "Still open"
      subtitle: "Found while counting, not fixed"

    - type: image
      heading: "A badge on a third of the catalog"
      src: "../post/png/12-badge-inflation.png"
      alt: "43 dots for live tools, 13 of them filled to mark a New badge"
      caption: "NEW_DAYS is 30. I shipped 13 tools last month."
      note: >
        The badge was a sensible rule at two tools a month. At thirteen it is a texture,
        not a signal. Suggested fix, not done: badge exactly what is on the shelf.

    - type: bullets
      heading: "The page is still missing three of its own sites"
      bullets:
        - "BattleCard, Failsafe, FitProfile: live, no card"
        - "Four hub tools absent from llms.txt"
        - "Tool count hardcoded in 4 crawlable places"
        - "Registry and hub are two lists, nothing reconciles them"
      note: >
        PROJECTS.md already requires every live tool to have a card. Nothing checks it.
        The hardcoded count had already drifted by three before this session; the Soon
        change resynced it by luck. Nothing here was committed.

    - type: cta
      heading: "Add the check, not the generator"
      subtitle: "A smoke test that fails when a hub card and the registry disagree"
      note: >
        Generating cards from the registry is the wrong altitude: the card copy is real
        writing and does not belong in a Python catalog. Validating the two against each
        other catches this exact class of bug, including the three missing cards, and
        costs one script. That is the decision I want.
