presentation:
  title: "Everything on the page was correct"
  subtitle: "Search, icons, and the checks that had to fail first"
  author: "Neorgon"
  date: "2026-08"
  theme: "neorgon"
  pattern: "grid"

  slides:
    - type: title
      heading: "Everything on the page was correct"
      subtitle: "Three good decisions that added up to a bad one"

    - type: bullets
      heading: "You typed, and nothing appeared to happen"
      bullets:
        - "Filtering worked, the count was right"
        - "The matches opened 1747px below the box"
        - "Past a favorites shelf, a recency rail, a category bar"
        - "All three faded, none of them left"
      note: >
        Measured at 1280x800, 6 favorites saved, query "json". Both states measured in
        the same page load, the before restored by neutralising only the new rules, so
        the hero typewriter is identical for both.

    - type: bullets
      heading: "Every one of those blocks was a good idea"
      bullets:
        - "Favorites shelf: still right"
        - "Recently shipped rail: the most-clicked thing"
        - "Floating pills: the most-complimented thing"
        - "None a mistake, all in the way at once"
      note: >
        This is the thesis of the whole readout. Each was a local decision that was
        correct where it stood, made without looking at what it was standing in.

    - type: divider
      heading: "Search"
      subtitle: "A mode, not a filter"

    - type: split
      heading: "Browse surfaces leave the flow while a query is live"
      left:
        heading: "Before"
        bullets:
          - "Favorites 660px"
          - "Recently shipped 654px"
          - "Category rail 62px"
          - "Pill cloud 200px"
      right:
        heading: "After"
        bullets:
          - "All four removed"
          - "Matched categories as a 23px chip row"
          - "Field scrolls under the header"
          - "Clearing returns you where you were"
      note: >
        Nothing is lost by hiding them. Both shelves render .site-card--echo clones of
        catalog cards, so every card they could show is already in the merged grid.

    - type: image
      heading: "Drawn to scale"
      src: "data:image/png;base64,"
      alt: "The vertical stack between the search field and the first match, before and after"
      caption: "1747px to 126px. Same viewport, same query."

    - type: divider
      heading: "Icons"
      subtitle: "The standard existed. Nobody could run it."

    - type: stats
      heading: "The set had drifted off its own documented rules"
      stats:
        - value: "49 / 49"
          label: "Icons breaking a rule docs/ICONS.md already stated"
        - value: "2.67x"
          label: "Spread in effective stroke weight"
        - value: "3"
          label: "Rendering black via currentColor in an img"
        - value: "2"
          label: "Byte-identical duplicate glyphs"
      note: >
        currentColor is correct for an inlined SVG and wrong inside an img, which loads
        the file as its own document with no colour to inherit. SafeGuard and Lockdown
        were the same file. Neither is visible reading files one at a time.

    - type: image
      heading: "One weight, or a different call every time"
      src: "data:image/png;base64,"
      alt: "Histogram of effective stroke weight per icon, before and after"
      caption: "Read from the files: before = git HEAD, after = working tree."

    - type: code
      heading: "The icon stopped being an image and became a shape"
      language: css
      code: |
        span.card-site-icon {
          background-color: var(--card-accent, #E326E4);
          mask-image: var(--icon);
        }
      note: >
        An img cannot inherit the page's colour. The file supplies the outline, the card
        supplies the fill. Paths must be root-relative: a relative url() in a custom
        property resolves against the stylesheet that substitutes the var, so all 49
        masks 404'd silently until that was fixed.

    - type: image
      heading: "The last two holdouts"
      src: "data:image/png;base64,"
      alt: "Which card selectors resolve their colour from var(--card-accent)"
      caption: "Tags, domain and Soon badge already agreed. NEW and the icon did not."

    - type: qa
      heading: "Questions so far?"
      subtext: "Search and icons. The checks come next."

    - type: divider
      heading: "The checks"
      subtitle: "A rule nobody can run decays quietly"

    - type: quote
      text: "all 0 linted icons on standard"
      source: "icon-lint.py, exit code 0, after the markup changed under it"

    - type: bullets
      heading: "Both guards were made to fail on purpose"
      bullets:
        - "Linter matched img only; spans became invisible to it"
        - "Diagram generator charted NaN and still wrote a PNG"
        - "Both now refuse to pass on a suspiciously small match"
        - "Regression reproduced deliberately to watch them exit 2"
      note: >
        A check you have never seen fail is not a check. The render-mode check was added
        at the same time: an exempt trademark rendered as a masked span, or one of ours
        left as a plain img, both fail now.

    - type: stats
      heading: "Measured"
      stats:
        - value: "13.9x"
          label: "Less space between question and answer"
        - value: "2.57px"
          label: "Effective stroke, all 49 icons"
        - value: "23px"
          label: "Chip row on mobile, was 52px wrapped"
        - value: "17"
          label: "Icons redrawn to carry the heavier line"
      note: >
        Layout figures re-taken in Playwright. The preview pane throttles rAF, so pills
        never boot there and the page under-reports matches; earlier numbers taken in it
        were wrong and are superseded.

    - type: bullets
      heading: "What it cost"
      bullets:
        - "49 elements changed from img to span"
        - "Masked icons depend on mask-image"
        - "Three redraws needed a second pass"
        - "Doorman read as a trash can, twice"
      note: >
        Fallback: a no-mask engine draws the same file as a background-image, so the
        stroke colour in each file is load-bearing rather than dead metadata. The bad
        silhouettes were only visible on a contact sheet, not file by file. Process cost
        worth recording: a git reset --hard during hook testing destroyed the uncommitted
        tree and it had to be rebuilt from session history.

    - type: bullets
      heading: "Still open"
      bullets:
        - "Four brand marks stay exceptions, on purpose"
        - "make hooks is opt-in, per clone"
        - "Post's layout numbers are copied, not computed"
        - "Nothing computes them; no function returns them"
      note: >
        The brand marks announce themselves with a dashed border and an EXTERNAL badge,
        and the linter enforces the exception both ways. The copied-numbers item is the
        same shape of problem as the rest of the work, one level up.

    - type: cta
      heading: "Try it"
      action: "Type something into the search box at neorgon.com"
      subtext: "Then run make check before touching an icon."
